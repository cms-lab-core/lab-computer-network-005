<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><rect width="1600" height="650" fill="white"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#202124}.n{fill:#fff;stroke:#5f6368;stroke-width:3}.l{stroke:#747b83;stroke-width:6}.h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px;fill:#5f6368}.req{fill:#1a73e8}.rep{fill:#188038}@keyframes request{0%{transform:translate(260px,220px);opacity:1}35%{transform:translate(800px,220px);opacity:1}45%{transform:translate(1320px,220px);opacity:1}46%,100%{opacity:0}}@keyframes reply{0%,48%{opacity:0;transform:translate(1320px,320px)}50%{opacity:1;transform:translate(1320px,320px)}82%{opacity:1;transform:translate(260px,320px)}90%{opacity:1}92%,100%{opacity:0}}.request{animation:request 9s linear infinite}.reply{animation:reply 9s linear infinite}</style><text class="h" x="800" y="55" text-anchor="middle">ARP: Request broadcast → Reply unicast</text><line class="l" x1="340" y1="270" x2="650" y2="270"/><line class="l" x1="950" y1="270" x2="1260" y2="270"/><rect class="n" x="120" y="205" width="220" height="130" rx="22"/><rect class="n" x="650" y="185" width="300" height="170" rx="22"/><rect class="n" x="1260" y="205" width="220" height="130" rx="22"/><text class="t" x="230" y="260" text-anchor="middle">pc1</text><text class="s" x="230" y="295" text-anchor="middle">10.5.0.10</text><text class="t" x="800" y="260" text-anchor="middle">sw1</text><text class="s" x="800" y="298" text-anchor="middle">broadcast domain</text><text class="t" x="1370" y="260" text-anchor="middle">pc2</text><text class="s" x="1370" y="295" text-anchor="middle">10.5.0.20</text><g class="request"><rect class="req" x="-80" y="-24" width="160" height="48" rx="10"/><text x="0" y="6" text-anchor="middle" fill="white">ARP Request</text></g><g class="reply"><rect class="rep" x="-72" y="-24" width="144" height="48" rx="10"/><text x="0" y="6" text-anchor="middle" fill="white">ARP Reply</text></g><text class="s" x="800" y="500" text-anchor="middle">После Reply pc1 может сформировать unicast Ethernet frame для IPv4 packet.</text></svg>